name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install go opus pkg-config autoconf automake libtool meson
          # Build vendored rnnoise as a static lib.
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/usr/local --disable-shared
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          cd ..
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          # Remove opus dylib so the linker is forced to use libopus.a.
          rm -f "$(brew --prefix opus)/lib/"libopus*.dylib
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
      - name: Build
        run: |
          cd shellapp
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o ../dist/shellapp-darwin-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: shellapp-darwin-arm64
          path: dist/shellapp-darwin-arm64

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev libasound2-dev pkg-config autoconf automake libtool meson ninja-build
          # Build vendored rnnoise as a static lib.
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/usr/local --disable-shared
          make -j$(nproc)
          sudo make install
          cd ..
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          # Remove the opus dynamic lib so the linker uses libopus.a from libopus-dev.
          sudo rm -f /usr/lib/x86_64-linux-gnu/libopus.so*
      - name: Build
        run: |
          cd shellapp
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o ../dist/shellapp-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: shellapp-linux-amd64
          path: dist/shellapp-linux-amd64

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-rnnoise
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: |
          source /ucrt64/etc/profile.d/go.sh
          export GOROOT=/ucrt64/lib/go
          export PATH=/ucrt64/bin:$GOROOT/bin:$PATH
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          mkdir -p dist
          cd shellapp
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-linkmode external -extldflags '-static -lpthread'" \
            -o ../dist/shellapp-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: shellapp-windows-amd64
          path: dist/shellapp-windows-amd64.exe

  release:
    needs: [build-darwin-arm64, build-linux-amd64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Make binaries executable
        run: chmod +x dist/shellapp-darwin-arm64 dist/shellapp-linux-amd64
      - name: Generate checksums
        run: |
          cd dist
          sha256sum shellapp-darwin-arm64 > shellapp-darwin-arm64.sha256
          sha256sum shellapp-linux-amd64  > shellapp-linux-amd64.sha256
          sha256sum shellapp-windows-amd64.exe > shellapp-windows-amd64.exe.sha256
      - name: Commit dist to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x dist/shellapp-darwin-arm64 dist/shellapp-linux-amd64
          git add dist/
          git diff --staged --quiet || git commit -m "release: dist binaries for ${{ github.ref_name }}"
          git push
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shellapp-darwin-arm64
            dist/shellapp-darwin-arm64.sha256
            dist/shellapp-linux-amd64
            dist/shellapp-linux-amd64.sha256
            dist/shellapp-windows-amd64.exe
            dist/shellapp-windows-amd64.exe.sha256
