name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopus-dev libasound2-dev pkg-config autoconf automake libtool \
            meson ninja-build \
            xorg-dev libgl1-mesa-dev
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/usr/local --disable-shared
          make -j$(nproc)
          sudo make install
          cd ..
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          sudo rm -f /usr/lib/x86_64-linux-gnu/libopus.so*
      - name: Run unit tests
        run: |
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig go test ./engine/...

  build-darwin-arm64:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install go opus pkg-config autoconf automake libtool meson
          # Build vendored rnnoise as a static lib.
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/usr/local --disable-shared
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          cd ..
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          # Remove opus dylib so the linker is forced to use libopus.a.
          rm -f "$(brew --prefix opus)/lib/"libopus*.dylib
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
      - name: Build
        run: |
          cd ui
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o nito-darwin-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: nito-darwin-arm64
          path: ui/nito-darwin-arm64

  build-linux-amd64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopus-dev libasound2-dev pkg-config autoconf automake libtool \
            meson ninja-build \
            xorg-dev libgl1-mesa-dev
          # Build vendored rnnoise as a static lib.
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/usr/local --disable-shared
          make -j$(nproc)
          sudo make install
          cd ..
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          ninja -C build
          cd ..
          # Remove the opus dynamic lib so the linker uses libopus.a from libopus-dev.
          sudo rm -f /usr/lib/x86_64-linux-gnu/libopus.so*
      - name: Build
        run: |
          cd ui
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o nito-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: nito-linux-amd64
          path: ui/nito-linux-amd64

  build-windows-amd64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-rnnoise
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-mesa
      - name: Build
        shell: msys2 {0}
        run: |
          source /ucrt64/etc/profile.d/go.sh
          export GOROOT=/ucrt64/lib/go
          export PATH=/ucrt64/bin:$GOROOT/bin:$PATH
          # Build vendored webrtc-audio-processing as a static lib.
          cd webrtc-audio-processing
          meson setup build --default-library=static -Dbuildtype=release
          # Patch Abseil cctz: <winstring.h> is not included by <windows.h> on
          # MinGW but time_zone_lookup.cc uses decltype(&WindowsCreateStringReference)
          # which requires the WinRT type declarations from that header.
          python3 -c "f='subprojects/abseil-cpp-20240722.0/absl/time/internal/cctz/src/time_zone_lookup.cc'; c=open(f).read(); [open(f,'w').write('#ifndef _WIN32_WINNT\n#define _WIN32_WINNT 0x0A00\n#endif\n#include <winstring.h>\n'+c)] if '<winstring.h>' not in c else None"
          ninja -C build
          cd ..
          cd ui
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-linkmode external -extldflags '-static -lpthread'" \
            -o nito-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: nito-windows-amd64
          path: ui/nito-windows-amd64.exe

  release:
    needs: [build-darwin-arm64, build-linux-amd64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum nito-darwin-arm64        > nito-darwin-arm64.sha256
          sha256sum nito-linux-amd64         > nito-linux-amd64.sha256
          sha256sum nito-windows-amd64.exe   > nito-windows-amd64.exe.sha256
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nito-darwin-arm64
            dist/nito-darwin-arm64.sha256
            dist/nito-linux-amd64
            dist/nito-linux-amd64.sha256
            dist/nito-windows-amd64.exe
            dist/nito-windows-amd64.exe.sha256
