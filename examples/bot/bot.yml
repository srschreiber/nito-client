# Example bot.yml — pairs with examples/bot/Dockerfile and the scripts
# under examples/bot/scripts/. Build + run with:
#
#   make run-bot-local
#
# which builds the worker image, compiles nito-bot from source, and runs
# the bootstrap flow (register → verify → invite → serve) against this
# config. See BOTS.md for the full field reference.

defaults:
  image: nito-example-worker:latest   # all commands inherit this image
  network: false                      # all commands offline by default
  rate_limit_rps: 1
  timeout_ms: 1000

commands:
  hello:
    script: hello.sh
    usage: "!hello"

  echo:
    script: echo.sh
    usage: "!echo <message>"

  motto:
    script: motto.sh
    usage: "!motto"
    env: ["MOTTO"]

  help:
    script: help.sh
    usage: "!help"

  ask:
    script: ask.sh
    usage: "!ask <question>"
    env: ["GEMINI_API_KEY"]
    network: true
    timeout_ms: 30000          # LLM round-trip can be slow; bump from 1s default
    rate_limit_rps: 0.2        # 1 question per 5s per sender — protects API quota
